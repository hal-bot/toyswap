services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/toyswap
      - SPRING_DATASOURCE_USERNAME=toyswap
      - SPRING_DATASOURCE_PASSWORD=toyswap_secret
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/items"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    networks:
      - toyswap-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - toyswap-net

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=toyswap
      - POSTGRES_USER=toyswap
      - POSTGRES_PASSWORD=toyswap_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toyswap"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - toyswap-net

volumes:
  pgdata:

networks:
  toyswap-net:
    driver: bridge
