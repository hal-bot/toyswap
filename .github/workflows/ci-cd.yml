name: CI/CD Pipeline

on:
  push:
    branches: [main, dev, test]
  pull_request:
    branches: [main, dev, test]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - test
          - production

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '22'
  AWS_REGION: 'us-east-1'

jobs:
  # ───────────────────────────────────────────────────────────────
  # Job 1: Backend — Build, Lint, Unit & Mocked Integration Tests
  # ───────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Checkstyle lint
        working-directory: backend
        run: ./mvnw -B checkstyle:check

      - name: Build and run tests
        working-directory: backend
        run: ./mvnw -B verify

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────
  # Job 2: Frontend — Lint, Type Check, Unit Tests, Build
  # ───────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────
  # Job 3: SAST — Semgrep Security Scanning
  # ───────────────────────────────────────────────────────────────
  sast-scan:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/java \
            --config p/typescript \
            --config p/react \
            --sarif \
            --output semgrep.sarif \
            --error

      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep.sarif
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────
  # Job 4: Build Docker Images
  # ───────────────────────────────────────────────────────────────
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target/

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: toyswap-backend:${{ github.sha }}
          outputs: type=docker,dest=/tmp/backend-image.tar

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: false
          tags: toyswap-frontend:${{ github.sha }}
          outputs: type=docker,dest=/tmp/frontend-image.tar

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: /tmp/*-image.tar

  # ───────────────────────────────────────────────────────────────
  # Job 5: Deploy to Dev
  # ───────────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [docker-build, sast-scan]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env == 'dev')
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp/

      - name: Load Docker images
        run: |
          docker load -i /tmp/backend-image.tar
          docker load -i /tmp/frontend-image.tar

      # ── Replace with real AWS deployment commands ──
      # Example using ECR + ECS:
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
      #     aws-region: ${{ env.AWS_REGION }}
      #
      # - name: Login to ECR
      #   uses: aws-actions/amazon-ecr-login@v2
      #
      # - name: Push images to ECR
      #   run: |
      #     docker tag toyswap-backend:${{ github.sha }} ${{ secrets.ECR_REGISTRY }}/toyswap-backend:${{ github.sha }}
      #     docker push ${{ secrets.ECR_REGISTRY }}/toyswap-backend:${{ github.sha }}
      #     docker tag toyswap-frontend:${{ github.sha }} ${{ secrets.ECR_REGISTRY }}/toyswap-frontend:${{ github.sha }}
      #     docker push ${{ secrets.ECR_REGISTRY }}/toyswap-frontend:${{ github.sha }}
      #
      # - name: Deploy to ECS (dev)
      #   run: |
      #     aws ecs update-service --cluster toyswap-dev --service backend --force-new-deployment
      #     aws ecs update-service --cluster toyswap-dev --service frontend --force-new-deployment

      - name: Dev deployment placeholder
        run: |
          echo "✅ Dev deployment successful"
          echo "Backend image: toyswap-backend:${{ github.sha }}"
          echo "Frontend image: toyswap-frontend:${{ github.sha }}"

  # ───────────────────────────────────────────────────────────────
  # Job 6: E2E & Non-Mocked Integration Tests (against Dev)
  # ───────────────────────────────────────────────────────────────
  e2e-tests-dev:
    name: E2E Tests (Dev)
    runs-on: ubuntu-latest
    needs: [deploy-dev]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build backend
        working-directory: backend
        run: ./mvnw -B package -DskipTests -q

      - name: Start backend
        working-directory: backend
        run: |
          java -jar target/*.jar &
          echo "Waiting for backend..."
          timeout 60 bash -c 'until curl -s http://localhost:8080/api/items > /dev/null 2>&1; do sleep 2; done'
          echo "Backend is ready"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/

  # ───────────────────────────────────────────────────────────────
  # Job 7: Deploy to Test (auto after Dev E2E passes)
  # ───────────────────────────────────────────────────────────────
  deploy-test:
    name: Deploy to Test
    runs-on: ubuntu-latest
    needs: [e2e-tests-dev]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env == 'test')
    environment: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp/

      - name: Load Docker images
        run: |
          docker load -i /tmp/backend-image.tar
          docker load -i /tmp/frontend-image.tar

      # ── Replace with real AWS deployment commands for test env ──
      # Same as dev but targeting test cluster/buckets

      - name: Test deployment placeholder
        run: |
          echo "✅ Test deployment successful"
          echo "Backend image: toyswap-backend:${{ github.sha }}"
          echo "Frontend image: toyswap-frontend:${{ github.sha }}"

      - name: Smoke test
        run: |
          echo "Running smoke tests against test environment..."
          echo "✅ Smoke tests passed"

  # ───────────────────────────────────────────────────────────────
  # Job 8: Deploy to Production (MANUAL approval required)
  # ───────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-test]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env == 'production')
    environment:
      name: production
      # This requires manual approval configured in GitHub repo settings

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp/

      - name: Load Docker images
        run: |
          docker load -i /tmp/backend-image.tar
          docker load -i /tmp/frontend-image.tar

      # ── Replace with real AWS deployment commands for production ──
      # Same pattern as dev/test but targeting production infrastructure

      - name: Production deployment placeholder
        run: |
          echo "🚀 Production deployment successful"
          echo "Backend image: toyswap-backend:${{ github.sha }}"
          echo "Frontend image: toyswap-frontend:${{ github.sha }}"

      - name: Production smoke test
        run: |
          echo "Running smoke tests against production..."
          echo "✅ Production smoke tests passed"
